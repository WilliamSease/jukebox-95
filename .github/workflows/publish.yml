name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:

    if: github.actor != 'github-actions[bot]'

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v3
        with:
          ref: main
      
      - name: Create release bump branch
        run: git checkout -b release-bump-${{ github.run_id }}

      - name: Automated Version Bump (main/root)
        uses: 'phips28/gh-action-bump-version@master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: 'williamsease/jukebox-95/'
        with:
          version-type: 'patch'
          tag-prefix: 'v'
          target-branch: 'release-bump-${{ github.run_id }}'

      - name: Automated Version Bump (main/release/app)
        uses: 'phips28/gh-action-bump-version@master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: 'williamsease/jukebox-95/'
        with:
          version-type: 'patch'
          PACKAGEJSON_DIR: 'release/app'
          skip-tag: 'true'
          target-branch: 'release-bump-${{ github.run_id }}'

      - name: Get bumped version
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open and auto-merge bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base main --head release-bump-${{ github.run_id }} --title "ci: version bump to v${{ steps.get-version.outputs.version }}" --body "Automated" >> gh pr merge -t "ci: version bump to v${{ steps.get-version.outputs.version }}" --auto -d -s

      - name: Install Node and NPM
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm install
          npm run postinstall
          npm run build

      - name: Publish releases
        id: publish-release-id
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          npm exec electron-builder -- --publish always --win --linux --x64

  finalize-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.publish.outputs.version }}" --draft=false --repo WilliamSease/jukebox-95